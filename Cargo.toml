[package]
name = "vect_or_engine_lib"
version = "0.2.0"
edition = "2021"
authors = ["1abcdefggs"]
description = "High-performance vector search (HNSW) and semantic validation engine in Rust"
license = "MIT"
repository = "https://github.com/1abcdefggs/vect-or-engine"
readme = "README.md"

[lib]
name = "vect_or_engine_lib"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "io-util", "io-std"] }
aho-corasick = "1.1"
half = { version = "2.4", features = ["serde"] }
memmap2 = "0.9"
rayon = "1.10"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
